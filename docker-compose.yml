version: '3.8'

services:
  # ── 1. Backend REST API Service ──────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: career_intelligence_api
    command: python app.py
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - DATABASE_PATH=/app/data/career_intelligence.db
      - REQUIRE_AUTH=true
    volumes:
      - sqlite_data:/app/data
      - uploads_data:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── 2. Streamlit Dashboard Frontend ──────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: career_intelligence_dashboard
    command: streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://api:5000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite_data:
  uploads_data:
